<!doctype html>
<html lang="en" dir="ltr"> 
 <head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Terminology_Lec8_Quiz</title> 
  <script src="https://cdn.tailwindcss.com"></script> 
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"> 
  <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #E5E4E2;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .option-button {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
        }
        .option-button:hover:not(.answered) {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
        }
        /* Icon styles */
        .feedback-icon {
            width: 24px;
            height: 24px;
            margin-left: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .feedback-icon-visible {
            opacity: 1;
        }
    </style> 
 </head> 
 <body> 
  <div id="quiz-container" class="w-full max-w-2xl bg-white shadow-xl rounded-2xl p-6 md:p-10"> 
   <div class="flex justify-between items-center mb-6 border-b pb-4 border-gray-200"> 
    <h1 class="text-2xl font-bold text-[#6D9BCA]">Terminology_Lec8_Quiz</h1> 
    <div class="text-lg font-semibold text-gray-700">
      Score: <span id="score-display" class="text-green-600">0</span> / <span id="total-questions">0</span> 
    </div> 
   </div> 
   <div id="question-card" class="mb-8 min-h-24"> 
    <p class="text-2xl font-semibold text-gray-800 mb-4" id="question-text"> Loading question... </p> 
    <div id="options-container" class="space-y-4"> 
    </div> 
   </div> 
   <div class="flex justify-between items-center pt-4 border-t border-gray-200"> 
    <div class="text-lg text-gray-600 font-medium">
      Question <span id="current-q-number">0</span> of <span id="total-questions-footer">0</span> 
    </div> 
    <div class="flex gap-3"> <!-- Previous Question Button --> <button id="prev-button" onclick="previousQuestion()" class="px-6 py-3 bg-black text-white font-bold rounded-xl shadow-lg hover:bg-gray-800 transition duration-150 ease-in-out disabled:bg-gray-400" disabled> &lt; </button> <!-- Next Question Button --> <button id="next-button" onclick="nextQuestion()" class="px-6 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition duration-150 ease-in-out disabled:bg-gray-400" disabled> &gt; </button> 
    </div> 
   </div> 
   <div id="final-score-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50"> 
    <div class="bg-white rounded-xl p-8 text-center shadow-2xl w-full max-w-sm"> 
     <h2 class="text-4xl font-extrabold text-blue-600 mb-4">Quiz Complete!</h2> 
     <p class="text-xl text-gray-700 mb-6">Your final score is:</p> 
     <p class="text-6xl font-black text-green-700 mb-8" id="final-score-text">0 / 0</p> <button onclick="window.location.reload()" class="px-6 py-3 bg-green-600 text-white font-bold rounded-xl hover:bg-green-700 transition duration-150"> Start Over </button> 
    </div> 
   </div> 
  </div> 
  <script>
    const quizData = [
               
             
  {
    question: "1. A chronic illness is characterized by which specific temporal quality?",
    options: [
      "A. A sudden onset and short course",
      "B. An intense, rapid progression",
      "C. Being marked by long duration or frequent recurrence",
      "D. Immediate resolution after treatment",
      "E. A course of exactly 7-10 days"

    answer: "C. Being marked by long duration or frequent recurrence"

  {
    question: "2. The surgical procedure Arthrodesis is the specific process of:",
    options: [
      "A. Removing a damaged joint",
      "B. Stabilizing a joint through fusion",
      "C. Repairing a joint with an artificial implant",
      "D. Visual examination inside a joint",
      "E. Correcting a congenital joint deformity"
    ],
    answer: "B. Stabilizing a joint through fusion"
  },
  {
    question: "3. The suffix -ectasis denotes:",
    options: [
      "A. Surgical removal of a part",
      "B. Abnormal hardening of tissue",
      "C. Inflammation of a structure",
      "D. Dilatation or expansion",
      "E. Abnormal narrowing of a duct"
    ],
    answer: "D. Dilatation or expansion"
  },
  {
    question: "4. The root word -emesis refers to:",
    options: [
      "A. Vomiting",
      "B. Excessive salivation",
      "C. Stomach pain",
      "D. Indigestion",
      "E. Diarrhea"
    ],
    answer: "A. Vomiting"
  },
  {
    question: "5. Which term describes the peripheral compression of intestinal motility?",
    options: [
      "A. Hypermesis",
      "B. Peristalsis",
      "C. Desis",
      "D. Claudication",
      "E. Ectasis"
    ],
    answer: "B. Peristalsis"
  },
  {
    question: "6. Intermittent claudication is characterized by:",

    ],
    answer: "D. Limping or leg pain on exertion"
  },
  {
    question: "7. Which suffix denotes disease of a specific organ?",
    options: [
      "A. (-desis)",
      "B. (-plasty)",
      "C. (-rrhaphy)",
      "D. (-pexy)",
      "E. (-pathy)"
    ],
    answer: "E. (-pathy)"
  },
  {
    question: "8. The suffix -rrhaphy indicates:",
    options: [
      "A. Surgical puncture",
      "B. Suture or surgical repair",
      "C. Visual inspection",
      "D. Reshaping tissue",
      "E. Fixation"
    ],
    answer: "B. Suture or surgical repair"
  },
  {
    question: "9. The suffix -pexy refers to:",
    options: [
      "A. Surgical fixation or suspension",
      "B. Cutting away tissue",
      "C. Surgical repair",
      "D. Opening an organ",
      "E. Formation"
    ],
    answer: "A. Surgical fixation or suspension"
  },
  {
    question: "10. Rhinoplasty refers to:",
    options: [
      "A. Suture of nasal tissue",
      "B. Surgical repair or reshaping of the nose",
      "C. Complete removal of the nose",
      "D. Visual examination of nasal cavity",
      "E. Puncture to drain fluid"
    ],
    answer: "B. Surgical repair or reshaping of the nose"
  },
  {
    question: "11. The suffix -centesis denotes:",
    options: [
      "A. Surgical stabilization",
      "B. Incision and removal",
      "C. Cutting off a limb",
      "D. Visual examination",
      "E. Surgical puncture to withdraw fluid"
    ],
    answer: "E. Surgical puncture to withdraw fluid"
  },
  {
    question: "12. Visual inspection using a scope is called:",
    options: [
      "A. Thoracentesis",
      "B. Arthrodesis",
      "C. Herniorrhaphy",
      "D. Laparoscopy",
      "E. Rhinoplasty"
    ],
    answer: "D. Laparoscopy"
  },
  {
    question: "13. An Excisional Biopsy involves:",
    options: [
      "A. Cutting over and removing a portion",
      "B. Removing the entire mass or lesion",
      "C. Postmortem examination",
      "D. Slicing tissue sections",
      "E. Aspirating fluid"
    ],
    answer: "B. Removing the entire mass or lesion"
  },
  {
    question: "14. Cutting and opening the abdomen is termed:",
    options: [
      "A. Cardiotomy",
      "B. Vagotomy",
      "C. Abscission",
      "D. Arthroplasty",
      "E. Laparotomy"
    ],
    answer: "E. Laparotomy"
  },
  {
    question: "15. An instrument for thin tissue sections is a:",
    options: [
      "A. Dermatome",
      "B. Microtome",
      "C. Myotome",
      "D. Scalpel",
      "E. Hysteroscope"
    ],
    answer: "B. Microtome"
  },
  {
    question: "16. The cutting instrument used in skin grafting is:",
    options: [
      "A. Myotome",
      "B. Microtome",
      "C. Laparoscope",
      "D. Dermatome",
      "E. Vagotomy"
    ],
    answer: "D. Dermatome"
  },
  {
    question: "17. Abscission means:",
    options: [
      "A. Cutting away tissue",
      "B. Taking a small portion",
      "C. Opening an organ",
      "D. Stabilizing a joint",
      "E. Cutting off a limb"
    ],
    answer: "A. Cutting away tissue"
  },
  {
    question: "18. Colic pain may be caused by obstruction or:",
    options: [
      "A. Rupture",
      "B. Hypertrophy",
      "C. Torsion (twisting)",
      "D. Inflammation",
      "E. Bleeding"
    ],
    answer: "C. Torsion (twisting)"
  },
  {
    question: "19. An involuntary abnormal muscle contraction is:",
    options: [
      "A. Peristalsis",
      "B. Claudication",
      "C. Paroxysm",
      "D. Colic",
      "E. Spasm"
    ],
    answer: "E. Spasm"
  },
  {
    question: "20. Congenital narrowing of a vessel is:",
    options: [
      "A. Stenosis",
      "B. Coarctation",
      "C. Incompetence",
      "D. Dilatation",
      "E. Sclerosis"
    ],
    answer: "B. Coarctation"
  },
  {
    question: "21. Cardiotomy refers to:",
    options: [
      "A. Cutting and opening the heart",
      "B. Surgical puncture of the heart",
      "C. Suture repair",
      "D. Visual examination",
      "E. Partial removal"
    ],
    answer: "A. Cutting and opening the heart"
  },
  {
    question: "22. Hyperemesis gravidorum is:",
    options: [
      "A. Increased urination",
      "B. Weight gain",
      "C. High blood pressure",
      "D. Exaggerated vomiting in early pregnancy",
      "E. Severe abdominal pain"
    ],
    answer: "D. Exaggerated vomiting in early pregnancy"
  },
  {
    question: "23. The action of separation by cutting is:",
    options: [
      "A. Section",
      "B. Tome",
      "C. Ectomy",
      "D. Stomy",
      "E. Pexy"
    ],
    answer: "A. Section"
  },
  {
    question: "24. Complete postmortem examination is:",
    options: [
      "A. Biopsy",
      "B. Necropsy",
      "C. Necrosis",
      "D. Autolysis",
      "E. Pathology"
    ],
    answer: "B. Necropsy"
  },
  {
    question: "25. Localized pathological tissue death is:",
    options: [
      "A. Autolysis",
      "B. Biopsy",
      "C. Necropsy",
      "D. Ischemia",
      "E. Necrosis"
    ],
    answer: "E. Necrosis"
  },
  {
    question: "26. Breast duct ectasia may cause a:",
    options: [
      "A. Hernia",
      "B. Coarctation",
      "C. Ischemia",
      "D. Breast mass",
      "E. Laceration"
    ],
    answer: "D. Breast mass"
  },
  {
    question: "27. An inhibitor works by:",
    options: [
      "A. Exciting tissue",
      "B. Restraining or preventing action",
      "C. Dilating ducts",
      "D. Muscle contraction",
      "E. Surgical fixation"
    ],
    answer: "B. Restraining or preventing action"
  },
  {
    question: "28. An Incisional Biopsy involves:",
    options: [
      "A. Removing the entire mass",
      "B. Taking a live tissue sample",
      "C. Using a dermatome",
      "D. Cutting over a mass and removing part of it",
      "E. Preparing thin sections"
    ],
    answer: "D. Cutting over a mass and removing part of it"
  },
  {
    question: "29. Vagotomy is traditionally used to manage:",
    options: [
      "A. Myocardial ischemia",
      "B. Chronic peptic ulcer",
      "C. Bronchiectasis",
      "D. Inguinal hernia",
      "E. Mitral stenosis"
    ],
    answer: "B. Chronic peptic ulcer"
  },
  {
    question: "30. Surgical creation of an artificial joint is:",
    options: [
      "A. Arthrodesis",
      "B. Arthrocentesis",
      "C. Arthroplasty",
      "D. Arthroscopy",
      "E. Arthropexy"
    ],
    answer: "C. Arthroplasty"
  }
    
           

    ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;
        const totalQuestions = quizData.length;

        // --- DOM ELEMENTS ---
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const scoreDisplay = document.getElementById('score-display');
        const currentQNumber = document.getElementById('current-q-number');
        const nextButton = document.getElementById('next-button');
        const finalScoreModal = document.getElementById('final-score-modal');
        const finalScoreText = document.getElementById('final-score-text');
        const prevButton = document.getElementById('prev-button');

        // --- UTILITY ICONS (Inline SVG for instant rendering) ---
        const correctIconSVG = `
            <svg class="feedback-icon text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>`;
        const incorrectIconSVG = `
            <svg class="feedback-icon text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>`;

        // --- QUIZ LOGIC FUNCTIONS ---

        function loadQuestion() {
            if (currentQuestionIndex >= totalQuestions) {
                showFinalScore();
                return;
            }

            const currentQ = quizData[currentQuestionIndex];
            answered = false;
            nextButton.disabled = true;
            prevButton.disabled = currentQuestionIndex === 0;
            optionsContainer.innerHTML = '';

            // Clean the question number for display (it's prepended in the data for readability)
            questionText.textContent = currentQ.question;
            currentQNumber.textContent = currentQuestionIndex + 1;

            currentQ.options.forEach((optionText) => {
                const optionButton = document.createElement('button');
                optionButton.className = 'option-button w-full p-4 bg-gray-100 rounded-xl font-medium text-gray-700 shadow-sm border border-gray-200';
                optionButton.setAttribute('data-option', optionText);
                optionButton.innerHTML = `
                    <span class="flex-1">${optionText}</span>
                    <span class="feedback-placeholder"></span>
                `;
                optionButton.onclick = () => selectOption(optionText, optionButton);
                optionsContainer.appendChild(optionButton);
            });
        }

        function selectOption(selectedOptionText, selectedButton) {
            if (answered) {
                return; // Prevent multiple clicks on the current question
            }
            answered = true;
            nextButton.disabled = false;

            const currentQ = quizData[currentQuestionIndex];
            const isCorrect = selectedOptionText === currentQ.answer;

            if (isCorrect) {
                score++;
                scoreDisplay.textContent = score;
            }

            showFeedback(currentQ.answer, selectedButton);
        }

        function showFeedback(correctAnswer, selectedButton) {
            const buttons = optionsContainer.querySelectorAll('.option-button');

            buttons.forEach(button => {
                const optionText = button.getAttribute('data-option');
                const isCorrect = optionText === correctAnswer;
                const isSelected = button === selectedButton;

                button.classList.add('answered');
                button.disabled = true;

                const iconPlaceholder = button.querySelector('.feedback-placeholder');

                if (isCorrect) {
                    button.classList.add('bg-green-100', 'border-green-400');
                    iconPlaceholder.innerHTML = correctIconSVG;
                    iconPlaceholder.querySelector('.feedback-icon').classList.add('feedback-icon-visible');
                    button.classList.remove('bg-gray-100');
                } else if (isSelected) {
                    button.classList.add('bg-red-100', 'border-red-400');
                    iconPlaceholder.innerHTML = incorrectIconSVG;
                    iconPlaceholder.querySelector('.feedback-icon').classList.add('feedback-icon-visible');
                    button.classList.remove('bg-gray-100');
                }
            });
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }
        
        
        function previousQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        loadQuestion();
    }
}

        function showFinalScore() {
            finalScoreText.textContent = `${score} / ${totalQuestions}`;
            finalScoreModal.classList.remove('hidden');
        }

        // --- INITIALIZATION ---
        window.onload = function() {
            document.getElementById('total-questions').textContent = totalQuestions;
            document.getElementById('total-questions-footer').textContent = totalQuestions;
            loadQuestion();
        };

    </script> 
 
</body></html>
